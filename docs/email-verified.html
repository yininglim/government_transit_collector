<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Email verification</title>
  <style>
    body { margin: 0; padding: 24px; background: #f4f7fb; color: #172b4d; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 440px; margin: 12vh auto; padding: 24px; background: white; border: 1px solid #dce4ef; border-radius: 16px; }
    h1 { font-size: 24px; line-height: 1.3; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Email verification</h1>
    <p id="message">Open the verification link in your email, then return to Government Transit Collector and sign in.</p>
    <p>You can return to the device where you signed up. No app installation is needed on this device.</p>
  </main>
  <script>
    // Supabase verifies the email before redirecting here. Do not exchange the
    // PKCE code, initialize an auth client, or launch the mobile app.
    const query = new URLSearchParams(location.search);
    const fragment = new URLSearchParams(location.hash.slice(1));
    const failed = query.has('error') || query.has('error_code') || fragment.has('error') || fragment.has('error_code');
    const confirmed = query.has('code') || fragment.get('type') === 'signup';
    history.replaceState(null, '', location.pathname);
    if (failed) {
      document.getElementById('title').textContent = 'Unable to verify email';
      document.getElementById('message').textContent = 'This link may be invalid or expired. Return to the app and request another verification email.';
    } else if (confirmed) {
      document.getElementById('title').textContent = 'Email verification complete';
      document.getElementById('message').textContent = 'Return to Government Transit Collector on your original device and sign in with your email and password.';
    }
  </script>
</body>
</html>
