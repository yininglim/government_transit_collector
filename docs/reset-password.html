<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://hmbkuofoxrmwopyuaqlx.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Reset Password — Government Transit Collector</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: #f4f7fb; color: #172b4d; font: 16px/1.5 system-ui, sans-serif; }
    main { width: 100%; max-width: 440px; margin: 5vh auto; padding: 24px; background: white; border: 1px solid #dce4ef; border-radius: 16px; }
    h1 { margin: 0 0 12px; font-size: 26px; }
    p { overflow-wrap: anywhere; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    .field { display: flex; margin-top: 6px; border: 1px solid #718096; border-radius: 8px; overflow: hidden; }
    input { min-width: 0; width: 100%; padding: 12px; border: 0; font: inherit; }
    button { min-height: 44px; cursor: pointer; font: inherit; border-radius: 8px; }
    .eye { flex: 0 0 44px; border: 0; background: white; color: #344b6e; }
    svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; vertical-align: middle; }
    button:disabled { opacity: .55; cursor: default; }
    .primary { margin-top: 20px; width: 100%; border: 0; background: #1565c0; color: white; }
    .back { width: 100%; margin-top: 12px; border: 0; background: transparent; color: #1565c0; }
    .hint { font-size: 14px; color: #52637a; }
    #status { color: #a11b1b; }
    #status.success { color: #166534; }
    :focus-visible { outline: 3px solid #64b5f6; outline-offset: 2px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Reset Password</h1>
    <p id="intro">Set a new password for Government Transit Collector.</p>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="verify-link" class="primary" type="button" hidden>Continue to password reset</button>
    <form id="reset-form" novalidate hidden>
      <label for="password">New Password</label>
      <div class="field">
        <input id="password" type="password" autocomplete="new-password" aria-describedby="requirements" required>
        <button class="eye" type="button" data-field="password" aria-label="Show New Password" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <label for="confirmation">Confirm New Password</label>
      <div class="field">
        <input id="confirmation" type="password" autocomplete="new-password" required>
        <button class="eye" type="button" data-field="confirmation" aria-label="Show Confirm New Password" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p class="hint" id="requirements">Password must be at least 8 characters and include uppercase, lowercase, number, and special character.</p>
      <button id="submit" class="primary" type="submit">Reset Password</button>
    </form>
    <button id="back" class="back" type="button">Back to Sign In</button>
    <p class="hint" id="return-help">After resetting, return to Sign In in the app on your original device. Your Google password will not be changed.</p>
    <noscript>Enable JavaScript to securely reset your password, then reopen the link from your email.</noscript>
  </main>
  <script>
    (() => {
      'use strict';
      // Public client configuration only. Never use a service-role/secret key.
      const supabaseUrl = 'https://hmbkuofoxrmwopyuaqlx.supabase.co';
      const publicKey = 'sb_publishable_MrIuXNjaTi93cKN3ptk13A_JDaAravP';
      const params = new URLSearchParams(location.hash.slice(1));
      let tokenHash = params.get('type') === 'recovery' ? params.get('token_hash') : null;
      params.delete('token_hash');
      // The email token is not sent to GitHub Pages, stored, logged, or displayed.
      history.replaceState(null, '', location.pathname);
      let session = null;
      let busy = false;
      let finished = false;
      const form = document.getElementById('reset-form');
      const password = document.getElementById('password');
      const confirmation = document.getElementById('confirmation');
      const status = document.getElementById('status');
      const submit = document.getElementById('submit');
      const back = document.getElementById('back');
      const verifyLink = document.getElementById('verify-link');
      const invalidLink = 'This password reset link is invalid or has expired. Please request a new link from the app.';
      const requirements = document.getElementById('requirements').textContent;

      // Matches Flutter AuthValidation.newPassword. No password is submitted
      // until both local validation and Supabase recovery verification succeed.
      function passwordError(value, repeated, email) {
        if (!value.trim()) return 'Password is required.';
        if (email && value.trim().toLowerCase() === email.trim().toLowerCase()) return 'Password cannot be the same as your email address.';
        if (value.length < 8 || !/[A-Z]/.test(value) || !/[a-z]/.test(value) || !/[0-9]/.test(value) || !/[!-/:-@\[-`{-~]/.test(value)) return requirements;
        if (!repeated.trim()) return 'Confirm password is required.';
        if (value !== repeated) return 'Passwords do not match.';
        return null;
      }

      async function request(path, body, accessToken, method = 'POST') {
        const abort = new AbortController();
        const timeout = setTimeout(() => abort.abort(), 15000);
        try {
          const headers = { apikey: publicKey, 'Content-Type': 'application/json' };
          if (accessToken) headers.Authorization = `Bearer ${accessToken}`;
          const response = await fetch(`${supabaseUrl}/auth/v1/${path}`, {
            method, headers, body: body ? JSON.stringify(body) : undefined,
            credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer', signal: abort.signal,
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            let message = 'Unable to reset your password. Please try again.';
            if (response.status === 429) message = 'Too many requests. Please wait before trying again.';
            else if (path === 'verify' || response.status === 401 || response.status === 403) message = invalidLink;
            else if (data.code === 'same_password') message = 'Your new password cannot be the same as your previous password.';
            else if (data.code === 'weak_password') message = requirements;
            throw new Error(message);
          }
          return data;
        } finally {
          clearTimeout(timeout);
        }
      }

      async function releaseSession() {
        const previous = session;
        session = null;
        if (previous) {
          try { await request('logout?scope=local', null, previous.accessToken); } catch (_) { /* Memory-only session is discarded regardless. */ }
        }
      }

      for (const eye of document.querySelectorAll('.eye')) {
        eye.addEventListener('click', () => {
          const field = document.getElementById(eye.dataset.field);
          field.type = field.type === 'password' ? 'text' : 'password';
          const showing = field.type === 'text';
          eye.setAttribute('aria-pressed', String(showing));
          eye.setAttribute('aria-label', `${showing ? 'Hide' : 'Show'} ${field.id === 'password' ? 'New Password' : 'Confirm New Password'}`);
        });
      }

      form.hidden = true;
      verifyLink.hidden = !tokenHash;
      if (!tokenHash) status.textContent = invalidLink;
      // Verify ownership and provider eligibility before offering password
      // fields. A user gesture keeps email scanners from consuming the link.
      verifyLink.addEventListener('click', async () => {
        if (busy || finished || !tokenHash) return;
        busy = true;
        verifyLink.disabled = back.disabled = true;
        status.textContent = 'Checking reset link…';
        try {
          const verified = await request('verify', { token_hash: tokenHash, type: 'recovery' });
          tokenHash = null;
          if (!verified.access_token || !verified.user?.email || !verified.expires_in) throw new Error(invalidLink);
          session = { accessToken: verified.access_token, email: verified.user.email, expiresAt: Date.now() + verified.expires_in * 1000 };
          const identities = Array.isArray(verified.user.identities) ? verified.user.identities : [];
          if (!identities.some(identity => identity.provider === 'email')) {
            finished = true;
            verifyLink.hidden = true;
            status.textContent = identities.some(identity => identity.provider === 'google')
              ? 'This account uses Google Sign-In. Please continue with Google.'
              : 'Password reset is not available for this sign-in method.';
            await releaseSession();
            return;
          }
          verifyLink.hidden = true;
          form.hidden = false;
          status.textContent = '';
        } catch (error) {
          status.textContent = error instanceof TypeError || error.name === 'AbortError'
            ? 'Unable to connect. Check your connection and try again.' : error.message;
        } finally {
          busy = false;
          verifyLink.disabled = back.disabled = false;
        }
      });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (busy || finished) return;
        if (!session) { status.textContent = invalidLink; return; }
        const validation = passwordError(password.value, confirmation.value, session?.email);
        if (validation) { status.textContent = validation; return; }
        busy = true;
        submit.disabled = back.disabled = true;
        password.disabled = confirmation.disabled = true;
        status.textContent = 'Updating password…';
        try {
          if (Date.now() >= session.expiresAt) throw new Error(invalidLink);
          await request('user', { password: password.value }, session.accessToken, 'PUT');
          finished = true;
          form.hidden = true;
          status.className = 'success';
          status.textContent = 'Password updated successfully. Return to the app and sign in with your new password.';
          void releaseSession();
        } catch (error) {
          status.textContent = error instanceof TypeError || error.name === 'AbortError'
            ? 'Unable to connect. Check your connection and try again.' : error.message;
        } finally {
          password.value = confirmation.value = '';
          password.type = confirmation.type = 'password';
          for (const eye of document.querySelectorAll('.eye')) {
            eye.setAttribute('aria-pressed', 'false');
            eye.setAttribute('aria-label', `Show ${eye.dataset.field === 'password' ? 'New Password' : 'Confirm New Password'}`);
          }
          busy = false;
          submit.disabled = back.disabled = false;
          password.disabled = confirmation.disabled = false;
        }
      });
      back.addEventListener('click', () => {
        if (busy) return;
        finished = true;
        tokenHash = null;
        password.value = confirmation.value = '';
        form.hidden = true;
        verifyLink.hidden = true;
        document.getElementById('heading').textContent = 'Sign In';
        document.getElementById('intro').textContent = 'Return to Government Transit Collector on your original device and open Sign In. You can close this browser page.';
        back.hidden = true;
        void releaseSession();
      });
      window.addEventListener('pagehide', () => { tokenHash = null; session = null; });
    })();
  </script>
</body>
</html>
